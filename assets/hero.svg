
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 910 200"
     width="910"
     height="200"
     fill="none">

  <defs>
    <!-- ================= BACKGROUND ================= -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="48%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#070B13"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="25%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#E6EDF3"/>
      <stop offset="75%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="25%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#6D5DFC"/>
      <stop offset="75%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="25%" stop-color="#F97316"/>
      <stop offset="48%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="waveOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FB923C"/>
      <stop offset="70%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>

    <!-- ================= ATMOSPHERIC GLOW ================= -->

    <radialGradient id="orangeOrb">
      <stop offset="0%" stop-color="#F97316" stop-opacity=".32"/>
      <stop offset="55%" stop-color="#F97316" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueOrb">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".32"/>
      <stop offset="55%" stop-color="#3B82F6" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleOrb">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#3B82F6" flood-opacity=".38" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frameClip">
      <rect x="1" y="1" width="908" height="198" rx="10"/>
    </clipPath>

    <clipPath id="titleClip">
      <text x="455" y="82"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="31"
            font-weight="800"
            letter-spacing="1.5">REZA DEHGHANI</text>
    </clipPath>

    <!-- ================= DOT PATTERN ================= -->

    <pattern id="dots" width="12" height="12"
             patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#60A5FA" opacity=".45"/>
    </pattern>

    <!-- ================= ANIMATIONS ================= -->

    <style>
      @keyframes breathe {
        0%,100% { opacity:.45; }
        50% { opacity:1; }
      }

      @keyframes floatA {
        0%,100% { transform:translate(0,0); }
        25% { transform:translate(7px,-5px); }
        50% { transform:translate(-2px,-9px); }
        75% { transform:translate(-6px,3px); }
      }

      @keyframes floatB {
        0%,100% { transform:translate(0,0); }
        30% { transform:translate(-8px,5px); }
        65% { transform:translate(5px,-7px); }
      }

      @keyframes waveMove {
        0%,100% { transform:translateX(-7px); }
        50% { transform:translateX(7px); }
      }

      @keyframes borderFlow {
        0% { stroke-dashoffset:0; }
        100% { stroke-dashoffset:-200; }
      }







      @keyframes scan {
        0% { transform:translateY(-110px); opacity:0; }
        15% { opacity:.5; }
        85% { opacity:.3; }
        100% { transform:translateY(220px); opacity:0; }
      }

      @keyframes linePulse {
        0%,100% { opacity:.35; }
        50% { opacity:1; }
      }

      @keyframes spin {
        from { transform:rotate(0deg); }
        to { transform:rotate(360deg); }
      }

      @keyframes reverseSpin {
        from { transform:rotate(360deg); }
        to { transform:rotate(0deg); }
      }

      @keyframes drift {
        0% { stroke-dashoffset:0; }
        100% { stroke-dashoffset:-100; }
      }

      @keyframes spark {
        0%,100% { opacity:.15; r:1; }
        50% { opacity:1; r:2.5; }
      }

      @keyframes energyPulse {
        0%,100% { opacity:.35; stroke-width:1; }
        50% { opacity:1; stroke-width:2; }
      }

      @keyframes titleBreath {
        0%,100% { opacity:.94; }
        50% { opacity:1; }
      }

      .orb-orange {
        transform-box:fill-box;
        transform-origin:center;
        animation:floatA 9s ease-in-out infinite;
      }

      .orb-blue {
        transform-box:fill-box;
        transform-origin:center;
        animation:floatB 11s ease-in-out infinite;
      }

      .float-a {
        animation:floatA 6s ease-in-out infinite;
      }

      .float-b {
        animation:floatB 8s ease-in-out infinite;
      }

      .pulse {
        animation:breathe 2.6s ease-in-out infinite;
      }

      .wave {
        animation:waveMove 7s ease-in-out infinite;
      }

      .wave-reverse {
        animation:waveMove 9s ease-in-out infinite reverse;
      }

      .border-light {
        stroke-dasharray:38 162;
        animation:borderFlow 7s linear infinite;
      }

      .border-light-reverse {
        stroke-dasharray:26 174;
        animation:borderFlow 9s linear infinite reverse;
      }


      .scan {
        animation:scan 8s linear infinite;
      }

      .line-pulse {
        animation:linePulse 3s ease-in-out infinite;
      }

      .spark {
        animation:spark 2.5s ease-in-out infinite;
      }

      .energy {
        animation:energyPulse 3s ease-in-out infinite;
      }

      .title {
        animation:titleBreath 4s ease-in-out infinite;
      }

      .spin {
        transform-box:fill-box;
        transform-origin:center;
        animation:spin 24s linear infinite;
      }

      .reverse-spin {
        transform-box:fill-box;
        transform-origin:center;
        animation:reverseSpin 18s linear infinite;
      }

      .dash-flow {
        animation:drift 8s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .orb-orange,.orb-blue,.float-a,.float-b,.pulse,
        .wave,.wave-reverse,.border-light,.border-light-reverse,
        .shine,.scan,.line-pulse,.spark,.energy,.title,
        .spin,.reverse-spin,.dash-flow {
          animation:none !important;
        }
      }
    </style>
  </defs>

  <!-- ================= BACKGROUND ================= -->

  <g clip-path="url(#frameClip)">
    <rect width="910" height="200" fill="url(#bg)"/>

    <ellipse cx="80" cy="45" rx="240" ry="150"
             fill="url(#orangeOrb)" class="orb-orange"/>

    <ellipse cx="835" cy="145" rx="245" ry="155"
             fill="url(#blueOrb)" class="orb-blue"/>

    <ellipse cx="455" cy="90" rx="280" ry="120"
             fill="url(#purpleOrb)" class="orb-orange"/>

    <!-- Subtle technology grid -->

    <rect x="22" y="22" width="120" height="60"
          fill="url(#dots)" opacity=".6"/>

    <rect x="768" y="120" width="115" height="58"
          fill="url(#dots)" opacity=".6"/>

    <rect x="380" y="15" width="150" height="45"
          fill="url(#dots)" opacity=".18"/>

    <!-- Scanline

    <g class="scan">
      <rect x="0" y="0" width="910" height="2"
            fill="url(#accent)" opacity=".4"/>
    </g> -->

    <!-- ================= ENERGY WAVES ================= -->

    <g class="wave">
      <path d="M-30 108
               C75 60 125 160 230 116
               S350 83 410 110"
            stroke="url(#waveOrange)"
            stroke-width="1.4"
            opacity=".85"/>

      <path d="M-30 120
               C65 80 135 171 245 128
               S350 96 405 116"
            stroke="url(#waveOrange)"
            stroke-width=".7"
            opacity=".6"/>

      <path d="M940 108
               C835 60 785 160 680 116
               S560 83 500 110"
            stroke="url(#waveBlue)"
            stroke-width="1.4"
            opacity=".85"/>

      <path d="M940 120
               C845 80 775 171 665 128
               S560 96 505 116"
            stroke="url(#waveBlue)"
            stroke-width=".7"
            opacity=".6"/>
    </g>

    <g class="wave-reverse">
      <path d="M-30 166
               C65 124 110 188 200 157
               S315 126 375 146"
            stroke="url(#waveBlue)"
            stroke-width=".9"
            opacity=".65"/>

      <path d="M940 166
               C845 124 800 188 710 157
               S595 126 535 146"
            stroke="url(#waveOrange)"
            stroke-width=".9"
            opacity=".65"/>
    </g>

    <!-- ================= MOVING ENERGY STREAKS ================= -->

    <g filter="url(#glow)">
      <path d="M25 94 L180 94"
            stroke="url(#waveOrange)"
            stroke-width="1.4"
            class="energy"/>

      <path d="M730 94 L885 94"
            stroke="url(#waveBlue)"
            stroke-width="1.4"
            class="energy"/>

      <path d="M65 35 L125 35"
            stroke="#F97316"
            stroke-width=".8"
            stroke-dasharray="2 5"
            class="dash-flow"
            opacity=".6"/>

      <path d="M785 165 L850 165"
            stroke="#3B82F6"
            stroke-width=".8"
            stroke-dasharray="2 5"
            class="dash-flow"
            opacity=".6"/>
    </g>

    <!-- ================= ORBITING PARTICLES ================= -->

    <g class="spin">
      <circle cx="115" cy="47" r="2" fill="#FB923C" class="spark"/>
      <circle cx="145" cy="66" r="1.5" fill="#3B82F6" class="spark"/>
      <circle cx="95" cy="82" r="1.5" fill="#F97316" class="spark"/>
      <circle cx="135" cy="90" r="1" fill="#60A5FA" class="spark"/>
    </g>

    <g class="reverse-spin">
      <circle cx="795" cy="43" r="1.8" fill="#3B82F6" class="spark"/>
      <circle cx="820" cy="72" r="2" fill="#F97316" class="spark"/>
      <circle cx="775" cy="86" r="1.3" fill="#60A5FA" class="spark"/>
      <circle cx="840" cy="92" r="1.2" fill="#FB923C" class="spark"/>
    </g>

    <!-- Independent glowing particles -->

    <g filter="url(#softGlow)">
      <circle cx="70" cy="52" r="2" fill="#3B82F6" class="pulse"/>
      <circle cx="145" cy="155" r="1.7" fill="#F97316" class="pulse"/>
      <circle cx="218" cy="37" r="1.4" fill="#60A5FA" class="pulse"/>
      <circle cx="300" cy="170" r="1.5" fill="#FB923C" class="pulse"/>
      <circle cx="385" cy="31" r="1.7" fill="#8B5CF6" class="pulse"/>
      <circle cx="525" cy="34" r="1.6" fill="#3B82F6" class="pulse"/>
      <circle cx="610" cy="170" r="1.5" fill="#60A5FA" class="pulse"/>
      <circle cx="700" cy="33" r="1.8" fill="#F97316" class="pulse"/>
      <circle cx="770" cy="152" r="2" fill="#3B82F6" class="pulse"/>
      <circle cx="845" cy="50" r="1.6" fill="#FB923C" class="pulse"/>
      <circle cx="850" cy="174" r="1.4" fill="#60A5FA" class="pulse"/>
    </g>

    <!-- ================= TITLE BACKLIGHT ================= -->

    <text x="455" y="82"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="31"
          font-weight="800"
          letter-spacing="1.5"
          fill="#3B82F6"
          opacity=".25"
          filter="url(#strongGlow)">REZA DEHGHANI</text>

    <!-- Main title -->

    <text x="455" y="82"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="31"
          font-weight="800"
          letter-spacing="1.5"
          fill="url(#titleGradient)"
          filter="url(#textShadow)"
          class="title">REZA DEHGHANI</text>

    <!-- Moving highlight across title -->

    <!-- <g clip-path="url(#titleClip)" class="shine">
      <rect x="300" y="43" width="70" height="48"
            fill="#FFFFFF" opacity=".5"
            transform="skewX(-22)"/>
    </g> -->

    <!-- ================= NEON DIVIDER ================= -->

    <g filter="url(#glow)">
      <path d="M55 113 H350"
            stroke="url(#waveOrange)"
            stroke-width="1.2"
            class="line-pulse"/>

      <path d="M560 113 H855"
            stroke="url(#waveBlue)"
            stroke-width="1.2"
            class="line-pulse"/>

      <path d="M390 113 H520"
            stroke="url(#accent)"
            stroke-width=".7"
            opacity=".65"/>
    </g>

    <circle cx="350" cy="113" r="2.6"
            fill="#F97316" filter="url(#glow)" class="pulse"/>

    <circle cx="455" cy="113" r="3.2"
            fill="#3B82F6" filter="url(#glow)" class="pulse"/>

    <circle cx="560" cy="113" r="2.6"
            fill="#FB923C" filter="url(#glow)" class="pulse"/>

    <!-- ================= SUBTITLE ================= -->

    <text x="455" y="140"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="13"
          font-weight="600"
          letter-spacing="6"
          fill="url(#accent)"
          filter="url(#softGlow">WEB DEVELOPER</text>

    <text x="455" y="162"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="10.5"
          font-weight="400"
          letter-spacing="2.1"
          fill="#AAB7CC"
          opacity=".9">WP PLUGINS · BOTS · GRAPHIC DESIGN · TECH SUPPORT</text>

    <!-- ================= CORNER DECORATIONS ================= -->

    <g stroke="url(#borderGradient)" stroke-width="1" opacity=".7">
      <path d="M18 40 V18 H40"/>
      <path d="M870 18 H892 V40"/>
      <path d="M18 160 V182 H40"/>
      <path d="M870 182 H892 V160"/>
    </g>

    <g fill="#FB923C" class="pulse">
      <circle cx="18" cy="18" r="1.4"/>
      <circle cx="40" cy="18" r="1.4"/>
    </g>

    <g fill="#3B82F6" class="pulse">
      <circle cx="870" cy="18" r="1.4"/>
      <circle cx="892" cy="18" r="1.4"/>
    </g>

    <!-- ================= BORDER LIGHT TRAILS ================= -->

    <rect x="1" y="1" width="908" height="198" rx="10"
          stroke="url(#borderGradient)"
          stroke-width="1"
          opacity=".55"/>

    <rect x="1" y="1" width="908" height="198" rx="10"
          stroke="url(#borderGradient)"
          stroke-width="2"
          stroke-dasharray="40 160"
          filter="url(#glow)"
          class="border-light"/>

    <rect x="1" y="1" width="908" height="198" rx="10"
          stroke="url(#borderGradient)"
          stroke-width="1.5"
          stroke-dasharray="25 175"
          opacity=".9"
          filter="url(#softGlow)"
          class="border-light-reverse"/>

    <!-- Fine inner border -->

    <rect x="5" y="5" width="900" height="190" rx="7"
          stroke="#FFFFFF"
          stroke-opacity=".045"
          stroke-width=".7"/>

  </g>
</svg>
