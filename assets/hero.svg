<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="40%" stop-color="#FB923C"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes float1 { 0%,100% { transform: translate(0,0); } 33% { transform: translate(8px,-6px); } 66% { transform: translate(-5px,4px); } }
      @keyframes float2 { 0%,100% { transform: translate(0,0); } 33% { transform: translate(-10px,-4px); } 66% { transform: translate(6px,8px); } }
      @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
      @keyframes lineGlow { 0%,100% { opacity: 0.4; transform: scaleX(0.85); } 50% { opacity: 0.8; transform: scaleX(1); } }
      @keyframes fadeIn { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
      .orb1 { animation: float1 8s ease-in-out infinite; }
      .orb2 { animation: float2 10s ease-in-out infinite; }
      .pulse-dot { animation: pulse 2.5s ease-in-out infinite; }
      .glow-line { animation: lineGlow 3s ease-in-out infinite; transform-origin: center; }
      .title { animation: fadeIn 1.2s ease-out forwards; }
    </style>
  </defs>

  <rect width="910" height="200" rx="10" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="909" height="199" rx="9.5" stroke="#F97316" stroke-opacity="0.2"/>
  
  <rect width="910" height="200" fill="url(#orb1)" class="orb1"/>
  <rect width="910" height="200" fill="url(#orb2)" class="orb2"/>

  <!-- decorative lines -->
  <line x1="60" y1="120" x2="280" y2="120" stroke="url(#accent)" stroke-width="1.2" stroke-opacity="0.4" class="glow-line"/>
  <line x1="630" y1="130" x2="850" y2="130" stroke="url(#accent)" stroke-width="1.2" stroke-opacity="0.4" class="glow-line" style="animation-delay:0.8s;"/>

  <!-- floating dots -->
  <circle cx="80" cy="55" r="2" fill="#3B82F6" opacity="0.7" class="pulse-dot"/>
  <circle cx="820" cy="50" r="2.5" fill="#F97316" opacity="0.7" class="pulse-dot" style="animation-delay:0.8s"/>
  <circle cx="750" cy="165" r="1.8" fill="#3B82F6" opacity="0.6" class="pulse-dot" style="animation-delay:1.5s"/>
  <circle cx="170" cy="170" r="2.2" fill="#F97316" opacity="0.6" class="pulse-dot" style="animation-delay:2s"/>
  <circle cx="450" cy="35" r="1.5" fill="#8B5CF6" opacity="0.5" class="pulse-dot" style="animation-delay:1.2s"/>

  <!-- name -->
  <text x="455" y="86" text-anchor="middle" fill="#E6EDF3" font-family="Segoe UI, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="2" class="title" filter="url(#softglow)">REZA DEHGHANI</text>
  
  <!-- divider dots -->
  <circle cx="280" cy="118" r="2.5" fill="#F97316" opacity="0.9"/>
  <circle cx="455" cy="118" r="2.5" fill="#3B82F6" opacity="0.9"/>
  <circle cx="630" cy="118" r="2.5" fill="#F97316" opacity="0.9"/>

  <!-- subtitle -->
  <text x="455" y="142" text-anchor="middle" fill="url(#accent)" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" font-weight="500" letter-spacing="6" class="title">WEB DEVELOPER</text>
  <text x="455" y="162" text-anchor="middle" fill="#8B949E" font-family="Segoe UI, -apple-system, sans-serif" font-size="11.5" font-weight="400" letter-spacing="3" class="title">WP PLUGINS · BOTS · GRAPHIC DESIGN · TECH SUPPORT</text>
</svg>